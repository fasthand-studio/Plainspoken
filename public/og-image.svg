<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f5f3ef"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#d1d1d1" stroke-width="1"/>

  <!-- Card surface -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#ffffff" stroke="#e2e0db" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="80" y="80" width="5" height="470" rx="2.5" fill="#1a1a1a"/>

  <!-- PLAIN label -->
  <text x="145" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="80" font-weight="700" fill="#1a1a1a">PLAIN</text>
  <!-- spoken label -->
  <text x="145" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="80" font-weight="700" fill="#6b6b6b">spoken</text>

  <!-- Divider -->
  <line x1="145" y1="330" x2="700" y2="330" stroke="#e2e0db" stroke-width="1"/>

  <!-- Tagline -->
  <text x="145" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="26" font-weight="400" fill="#6b6b6b">A design system of 24 rules.</text>
  <text x="145" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="26" font-weight="400" fill="#6b6b6b">No shadows, no gradients, no fluff.</text>

  <!-- DO badge -->
  <rect x="145" y="452" width="64" height="30" rx="8" fill="none" stroke="#34c759" stroke-width="1.5"/>
  <text x="177" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="14" font-weight="600" fill="#34c759" text-anchor="middle">DO</text>

  <!-- DON'T badge -->
  <rect x="221" y="452" width="80" height="30" rx="8" fill="none" stroke="#ff3b30" stroke-width="1.5"/>
  <text x="261" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="14" font-weight="600" fill="#ff3b30" text-anchor="middle">DON'T</text>

  <!-- Rule count -->
  <text x="145" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="18" font-weight="500" fill="#9a9a9a">By Fasthand Studio · fasthandbd.com</text>

  <!-- Right visual: rule cards -->
  <rect x="760" y="130" width="300" height="56" rx="14" fill="#f5f3ef" stroke="#e2e0db" stroke-width="1"/>
  <text x="790" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34c759">DO</text>
  <text x="790" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">Curvature geometry</text>

  <rect x="760" y="202" width="300" height="56" rx="14" fill="#f5f3ef" stroke="#e2e0db" stroke-width="1"/>
  <text x="790" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34c759">DO</text>
  <text x="790" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">System sans type</text>

  <rect x="760" y="274" width="300" height="56" rx="14" fill="#f5f3ef" stroke="#e2e0db" stroke-width="1"/>
  <text x="790" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ff3b30">DON'T</text>
  <text x="790" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">No drop shadows</text>

  <rect x="760" y="346" width="300" height="56" rx="14" fill="#f5f3ef" stroke="#e2e0db" stroke-width="1"/>
  <text x="790" y="367" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ff3b30">DON'T</text>
  <text x="790" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">No custom fonts</text>

  <rect x="760" y="418" width="300" height="56" rx="14" fill="#f5f3ef" stroke="#e2e0db" stroke-width="1"/>
  <text x="790" y="439" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34c759">DO</text>
  <text x="790" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">Outlines for depth</text>
</svg>
